<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 1 - Service Quick</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='schedule_step1.css') }}">

</head>
<body>
    <div class="container">
        <h1>Step 1: Customer Information</h1>
        <form class="step-form" action="{{ url_for('step2') }}" method="post" enctype="multipart/form-data">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Name" >

            <label for="contactNum">Contact:</label>
            <input type="tel" id="contactNum" name="contactNum" placeholder="Contact Number" >
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Email" >

            <label for="address">Address:</label>
            <input type="text" id="address" name="address" placeholder="Address" >

            <label for="city">City:</label>
            <input type="text" id="city" name="city" placeholder="City" >

            
            <label for="state">State:</label>
            <input type="text" id="state" name="state" placeholder="State" >

            <label for="zipcode">Zip Code:</label>
            <input type="text" id="zipcode" name="zipcode" placeholder="Zip Code" >

            
            <div class="button-container">
                <button type="button" class="button back-button" onclick="window.history.back()">Back</button>
                <button type="submit" class="button">Next</button>
            </div>

        </form>
    </div>
</body>
</html>
