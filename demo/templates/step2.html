<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Step 2 - Service Quick</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>
    <div class="container">
        <h1>Step 2: Upload Images</h1>
        <form action="{{ url_for('step3') }}" method="post" enctype="multipart/form-data">
            <label for="file">Upload image:</label>
            <input type="file" id="file" name="file" required>
            
            <input type="hidden" name="name" value="{{ name }}">
            <input type="hidden" name="contactNum" value="{{ contactNum }}">
            <input type="hidden" name="location" value="{{ location }}">
            <input type="hidden" name="modelNum" value="{{ modelNum }}">
            <input type="hidden" name="serialNum" value="{{ serialNum }}">
            <input type="hidden" name="issue" value="{{ issue }}">

            <div class="button-container">
                <button type="button" class="button back-button" onclick="window.history.back();">Back</button>
                <button type="submit" class="button">Next</button>
            </div>
        </form>
    </div>
</body>
</html>
